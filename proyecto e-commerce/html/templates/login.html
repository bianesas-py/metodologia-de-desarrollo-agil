<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ina-Commerce</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="icon" type="image/jpeg"
        href="{{ url_for('static', filename='fotos/WhatsApp Image 2026-10-21 at 00.43.19 (1).jpeg') }}">
</head>

<body>

    <div class="exclamacion-exterior">!</div>

    <div class="marco-pixel">

        <div class="barra-superior">
            <div class="icono-planeta">
                <svg width="34" height="34" viewBox="0 0 16 16" fill="none">
                    <rect width="16" height="16" fill="#000" />
                    <rect x="2" y="2" width="12" height="12" fill="#2b6cb0" />
                    <rect x="4" y="3" width="5" height="4" fill="#38a169" />
                    <rect x="8" y="7" width="5" height="5" fill="#38a169" />
                    <rect x="3" y="10" width="6" height="3" fill="#38a169" />
                    <rect x="10" y="2" width="3" height="3" fill="#ecc94b" />
                </svg>
            </div>
            <div class="barra-direccion">
                <span class="fantasma-bar">👻</span>
                <input type="text" readonly value="https://ina-commerce.cl/login">
            </div>
        </div>

        <div class="contenido-ventana">

            <svg class="telarana telarana-izquierda" viewBox="0 0 100 100">
                <path d="M0,0 L100,0 M0,0 L0,100 M0,0 L100,100 M0,0 L35,100 M0,0 L100,35" stroke="#000" stroke-width="2"
                    fill="none" />
                <path d="M25,0 Q25,25 0,25 M50,0 Q50,50 0,50 M75,0 Q75,75 0,75" stroke="#000" stroke-width="2"
                    fill="none" />
            </svg>

            <svg class="telarana telarana-derecha" viewBox="0 0 100 100">
                <path d="M100,0 L0,0 M100,0 L100,100 M100,0 L0,100 M100,0 L65,100 M100,0 L0,35" stroke="#000"
                    stroke-width="2" fill="none" />
                <path d="M75,0 Q75,25 100,25 M50,0 Q50,50 100,50 M25,0 Q25,75 100,75" stroke="#000" stroke-width="2"
                    fill="none" />
            </svg>

            <svg class="telarana-naranja" viewBox="0 0 400 300">
                <g stroke="#ff8c00" stroke-width="3" fill="none">
                    <line x1="200" y1="150" x2="200" y2="10" />
                    <line x1="200" y1="150" x2="380" y2="40" />
                    <line x1="200" y1="150" x2="390" y2="150" />
                    <line x1="200" y1="150" x2="350" y2="270" />
                    <line x1="200" y1="150" x2="200" y2="290" />
                    <line x1="200" y1="150" x2="50" y2="270" />
                    <line x1="200" y1="150" x2="10" y2="150" />
                    <line x1="200" y1="150" x2="20" y2="40" />
                    <polygon points="200,50 300,90 310,150 280,220 200,230 120,220 90,150 100,90" />
                    <polygon points="200,90 250,110 255,150 240,185 200,190 160,185 145,150 150,110" />
                </g>
            </svg>

            <div class="sombrero-bruja">🧙‍♀️</div>

            <div class="contenedor-botones">
                <a href="/login-social/google" class="boton-pill">
                    <span class="icono-izq">🎃</span>
                    <span class="texto-btn">Iniciar Sesion con Google</span>
                    <span class="logo-google">
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                        </svg>
                    </span>
                </a>

                <a href="/login-social/facebook" class="boton-pill">
                    <span class="icono-izq">🦇</span>
                    <span class="texto-btn">Iniciar Sesion con Facebook</span>
                    <span class="logo-facebook">f</span>
                </a>

                <a href="/login-social/gmail" class="boton-pill">
                    <span class="icono-izq">🧟</span>
                    <span class="texto-btn">Iniciar Sesion con Gmail</span>
                    <span class="logo-gmail">✉️</span>
                </a>

                <a href="/invitado" class="boton-pill">
                    <span class="icono-izq">👻</span>
                    <span class="texto-btn">Iniciar Sesion Como Invitado</span>
                    <span class="logo-invitado">👤</span>
                </a>

                <div class="wrapper-explorar">
                    <a href="/" class="boton-explorar">
                        <span>Seguir Explorando</span>
                        <span class="icono-pc">🖥️</span>
                    </a>
                    <div class="aranita-colgando">🕷️</div>
                </div>
            </div>

            <div class="zombie-contenedor">
                <img src="{{ url_for('static', filename='fotos/zombie-descuento.jpg') }}" alt="Zombie Descuento 30%"
                    class="img-zombie">
            </div>

            <div class="pc-gamer-contenedor">
                <img src="{{ url_for('static', filename='fotos/pc-gamer.jpg') }}" alt="PC Gamer Pixel Art"
                    class="img-pc">
            </div>
        </div>
    </div>

</body>

</html>
